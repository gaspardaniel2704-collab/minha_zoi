<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

<h1>
Cada momento passado juntos é uma lembrança…<br>
cada lembrança está guardada no meu coração 💞
</h1>

<!-- BOTÃO DA MÚSICA -->
<button id="btnMusica">Toca-me 💖</button>

<!-- ÁUDIO -->
<audio id="musica" loop>
    <source src="{{ url_for('static', filename='musica.mp3') }}" type="audio/mp3">
</audio>

<!-- GALERIA -->
<div class="galeria">
  {% for i in range(1,10) %}
    <img src="{{ url_for('static', filename='fotos/foto' ~ i ~ '.JPG') }}">
  {% endfor %}
</div>

<br><br>

<!-- BOTÃO CONTINUAR -->
<a href="{{ url_for('pagina3') }}">
  <button>Continuar 💖</button>
</a>

</div>

<!-- SCRIPT DA MÚSICA -->
<script>
const btn = document.getElementById("btnMusica");
const musica = document.getElementById("musica");

let tocou = false;

btn.addEventListener("click", async () => {
    if (!tocou) {
        try {
            await musica.play();
            tocou = true;
            btn.innerText = "A tocar 💞";
            btn.disabled = true;
        } catch (e) {
            console.log("Erro ao tocar música:", e);
        }
    }
});
</script>

</body>
</html>
