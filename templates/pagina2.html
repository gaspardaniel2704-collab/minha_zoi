<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>
.btn-coracao {
    background: #ff4d6d;
    color: white;
    border: none;
    padding: 15px 25px;
    font-size: 18px;
    border-radius: 30px;
    cursor: pointer;
    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
}
</style>

</head>

<body>

<div class="container">

<h1>
Cada momento passado juntos é uma lembrança…<br>
cada lembrança está guardada no meu coração 💞
</h1>

<!-- BOTÃO -->
<button id="btnMusica" class="btn-coracao">Toca-me </button>

<!-- ÁUDIO SIMPLES (SEM preload complexo, SEM autoplay) -->
<audio id="musica" loop>
    <source src="{{ url_for('static', filename='musica.mp3') }}" type="audio/mp3">
</audio>

<!-- GALERIA -->
<div class="galeria">
  {% for i in range(1,10) %}
    <img src="{{ url_for('static', filename='fotos/foto' ~ i ~ '.JPG') }}">
  {% endfor %}
</div>

<br><br>

<a href="{{ url_for('pagina3') }}">
  <button>Continuar 💖</button>
</a>

</div>

<script>
const btn = document.getElementById("btnMusica");
const musica = document.getElementById("musica");

btn.addEventListener("click", function () {

    // FORÇA reset para evitar bloqueios
    musica.pause();
    musica.currentTime = 0;

    const playPromise = musica.play();

    if (playPromise !== undefined) {
        playPromise.then(function () {
            btn.innerText = "A tocar ";
            btn.disabled = true;
            btn.style.animation = "none";
        }).catch(function (error) {
            alert("O teu celular bloqueou o áudio. Tenta clicar novamente 💖");
            console.log(error);
        });
    }
});
</script>

</body>
</html>
